name: CI — cours et POC

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests des garanties et cas adverses
        run: python -m unittest discover -s tests -v
      - name: Compilation des sources
        run: python -m compileall -q pocs tests scripts ateliers/postgresql

  documentation:
    name: Documentation et wiki
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Vérifier les liens et générer les pages
        run: |
          python -m scripts.check_docs
          python -m scripts.build_wiki
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wiki-markdown
          path: build/wiki/*.md
          if-no-files-found: error
          retention-days: 14

  postgresql:
    name: Concurrence PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Démarrer PostgreSQL
        run: docker compose -f ateliers/postgresql/compose.yaml up -d --wait
      - name: Vérifier le dernier ticket sur PostgreSQL
        run: python ateliers/postgresql/race.py
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose -f ateliers/postgresql/compose.yaml logs --no-color
      - name: Arrêter le laboratoire
        if: always()
        run: docker compose -f ateliers/postgresql/compose.yaml down
